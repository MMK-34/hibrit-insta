name: Instagram otomatik paylaşım

on:
  schedule:
    # TR saati = UTC+3 -> 07:30-22:30 arası saatte bir (güncel haber hızlı çıksın)
    - cron: "30 4-19 * * *"
    # Yedek: her ana slottan 20 dk sonra (GitHub cron'u düşürebilir/geciktirebilir). Ana slot son 45 dk içinde
    # çalıştıysa run.mjs hiçbir şey yapmadan çıkar (yalnızca GITHUB_EVENT_NAME=schedule için).
    - cron: "50 4-19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal = olağan çalışma, dry = sadece üret (durum yazılmaz), force = eşiği yok say ve paylaş, stock = stoktan paylaş"
        required: false
        type: choice
        options:
          - normal
          - dry
          - force
          - stock
        default: normal
      trigger:
        description: "Dış zamanlayıcı (Cloudflare Worker) \"cron\" gönderir; 45 dk kapısı uygulanır. Elle çalıştırmada boş bırakın."
        required: false
        type: string
        default: ""
      repost:
        description: "Elle yeniden paylaşım (tek haber): 'haber URL | kategori | kaynak adı | başlık'. Boşsa olağan çalışma."
        required: false
        type: string
        default: ""

concurrency:
  group: post
  cancel-in-progress: false

permissions:
  contents: write
  issues: write # günlük özet ve hata raporları "Bot raporları" issue'suna yazılır (e-posta bildirimi)

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      # Kod denetimi: sözdizimi + tanımsız değişken. Hata varsa paylaşım yapılmaz, iş başarısız olur (GitHub e-posta gönderir).
      - name: Kod denetimi
        timeout-minutes: 5
        run: |
          for f in src/*.mjs; do node --check "$f"; done
          npx --no-install eslint -c scripts/eslint.config.mjs src/*.mjs # sürüm package-lock.json ile sabit

      - name: Yarış takvimi senkronu
        timeout-minutes: 5
        working-directory: cal
        run: node scripts/sync-calendar.mjs || echo "takvim hatası, son sağlam veri korundu"

      - name: Haber seç, üret, paylaş
        id: paylas
        # Adımın kendi zaman aşımı: iş (60 dk) bitmeden "Durumu kaydet" mutlaka çalışsın
        timeout-minutes: 40
        env:
          MODE: ${{ github.event.inputs.mode }}
          TRIGGER: ${{ github.event.inputs.trigger }}
          REPOST: ${{ github.event.inputs.repost }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_DISCOVERY_TOKEN: ${{ secrets.IG_DISCOVERY_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }} # telefon anlık bildirim (ntfy uygulaması) # organizatör hesaplarını okuma (Facebook sayfa token'ı, süresiz)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # GITHUB_EVENT_NAME (schedule / workflow_dispatch) Actions'ta varsayılan olarak tanımlı; run.mjs 45 dk kapısında kullanır
        run: |
          if [ -n "$REPOST" ]; then node src/run.mjs --repost; exit $?; fi
          case "$MODE" in
            dry) node src/run.mjs --dry ;;
            force) node src/run.mjs --force ;;
            stock) node src/run.mjs --stock ;;
            *) node src/run.mjs ;;
          esac

      - name: Stok postları tamamla (kuyruk 4'ün altındaysa 6'ya; değilse işlem yapmaz)
        # 45 dk kapısında atlanan (yedek cron) çalışmada stok tamamlanmaz
        if: ${{ !cancelled() && github.event.inputs.mode != 'dry' && steps.paylas.outputs.skipped != 'true' }}
        timeout-minutes: 15
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node src/stock.mjs || echo "stok üretimi başarısız, kuyruk olduğu gibi kaldı"

      - name: Önizleme (dry)
        if: ${{ always() && github.event.inputs.mode == 'dry' }}
        uses: actions/upload-artifact@v4
        with: { name: onizleme, path: out/ }

      - name: Durumu kaydet
        id: kaydet
        if: ${{ always() && github.event.inputs.mode != 'dry' }}
        run: |
          git config user.name "hibrit-bot"
          git config user.email "hibrit-bot@users.noreply.github.com"
          git add state cal/src/data
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -m "state: $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "durum gönderilemedi (3 deneme)"
          echo "push_failed=true" >> "$GITHUB_OUTPUT"
          exit 1

      # Gönderilemeyen durum kaybolmasın: state/ klasörü artifact olarak saklanır (elle geri yüklenebilir)
      - name: Durum yedeği (push başarısız)
        if: ${{ always() && steps.kaydet.outputs.push_failed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: state-yedek-${{ github.run_id }}
          path: state/

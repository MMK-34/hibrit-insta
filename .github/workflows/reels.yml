name: Haftalık bülten Reels

# Kullanıcı kuralı: bilgisayar kapalıyken de çalışır. Her pazar 17:00 (TR) haftanın doğrulanmış haberlerinden
# bülten videosu üretilir, onaya gönderilir; ONAY gelince post.yml (processApprovals) Reels olarak paylaşır.
on:
  schedule:
    - cron: "0 14 * * 0" # pazar 17:00 TR
  workflow_dispatch:
    inputs:
      dry:
        description: "true = yalnızca video üret (yükleme ve onay yok), video artifact olarak indirilebilir"
        required: false
        type: boolean
        default: false

concurrency:
  group: reels
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: ffmpeg ve yazı tipleri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji >/dev/null
          ffmpeg -version | head -1
      - name: Bülten üret ve onaya gönder
        timeout-minutes: 45
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_DISCOVERY_TOKEN: ${{ secrets.IG_DISCOVERY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HYPERFRAMES_NO_TELEMETRY: "1"
        run: |
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then node reels/weekly.mjs --dry; else node reels/weekly.mjs; fi
      - name: Video (artifact)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bulten
          path: reels/bulten-*/bulten-*.mp4
          if-no-files-found: ignore
